<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><b>Registration Form</b></title>
</head>
<body>
    <h1><b>Registration Form</b></h1>
    <form>
        <table>
            <tr>
                <td><label for="Name">Name </label></td>
                <td><input type="textbox" for="Name" id="Name" name="Name" placeholder="Enter Your Name" required></td>
            </tr>
            <tr>
                <td><label for="dob">DOB</label></td>
                <td><input type="date" for="dob" id="dob" name="dob" required></td>
            </tr>
            <tr>
                <td><label for="gender">Gender </label></td>
                <td>
                    <select>
                        <option id="male" >Male</option>
                        <option id="female">Female</option>
                        <option id="other">Other</option>

                    </select>
                    
                </td>
            </tr>
            <tr>
                <td><label for="Cgpa">CGPA </label></td>
                <td><input type="textbox" for="Cgpa" id="Cgpa" name="Cgpa" placeholder="Enter Your CGPA" required></td>
            </tr>
            <tr>
                <td><label for="ID">ID </label></td>
                <td><input type="textbox" for="ID" name="ID" id="ID" placeholder="Enter Your ID" required></td>
            </tr>
            <tr>
                <td><label for="Cnumber">Numbers of Credit</label></td>
                <td><input type="number" for="Cnumber" name="Cnumber" id="Cnumber" placeholder="Enter Your Credit Number" required></td>
            </tr>
        </table>
        <input type="submit" onclick="Document.getElementById().innerHTML='Clicked';"  value="Submit">
        <input type="reset" value="Reset">
    </form>
    
</body>
</html>
