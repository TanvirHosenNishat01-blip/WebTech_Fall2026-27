<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Implementation with List</title>
</head>
<body>
    <table border="1">
        <caption>Course Information</caption>
        <tr>
            <th>Science</th>
            <th>Commerce</th>
            <th>Humanities</th>
        </tr>
        <tr>
            <td>
                <ul type="disc">
                    <li>Physics</li>
                    <li>Chemistry</li>
                </ul>
            </td>
            <td>
                <ol type="A">
                    <li>Finance</li>
                    <li>Statistics</li>
                </ol>
            </td>
            <td>
                <ol type="1">
                    <li>History</li>
                    <li>Economics</li>
                </ol>
            </td>
        </tr>
    </table>
</body>
</html>
